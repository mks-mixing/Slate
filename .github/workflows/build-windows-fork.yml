name: Build Slate Windows (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/english-localization

permissions:
  contents: read

env:
  PDFIUM_TAG: "chromium/7891"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Apply English localization fixes
        shell: pwsh
        run: python scripts/patch-english-localization.py

      - name: Fetch PDFium binary
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors -o pdfium.tgz "$url"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          cp pdfium-extract/bin/pdfium.dll pdfium.dll
          rm -rf pdfium-extract pdfium.tgz
          ls -la pdfium.dll

      - name: Build alto-mcp sidecar
        shell: bash
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: |
          set -euo pipefail
          cd src-tauri
          mkdir -p binaries
          touch binaries/alto-mcp-x86_64-pc-windows-msvc.exe
          cargo build --release --bin alto-mcp
          cp target/release/alto-mcp.exe binaries/alto-mcp-x86_64-pc-windows-msvc.exe

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        with:
          projectPath: "."
          args: --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Slate-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
